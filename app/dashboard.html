<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criminal Network Analysis — SIH 2026</title>
<script src="/cytoscape.min.js"></script>
<style>
  :root{
    --bg:#0b0f1a; --panel:#121826; --card:#182031; --line:#263049;
    --txt:#e6ebf5; --mut:#8b96ad; --acc:#4f7cff; --good:#3ecf8e;
    --warn:#ffb454; --bad:#ff5c7a; --chip:#1d2740;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:14px/1.5 "Segoe UI",system-ui,sans-serif}
  #wrap{display:grid;grid-template-columns:300px 1fr 340px;grid-template-rows:56px 1fr;height:100vh}
  header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:17px;margin:0;letter-spacing:.3px}
  header h1 small{color:var(--mut);font-weight:400;margin-left:8px}
  header .tag{background:var(--card);border:1px solid var(--line);color:var(--mut);
    padding:3px 10px;border-radius:20px;font-size:12px}
  header .spacer{flex:1}
  header button{background:var(--acc);border:0;color:#fff;padding:7px 16px;border-radius:8px;
    cursor:pointer;font-weight:600}
  header button:disabled{opacity:.5;cursor:wait}

  .col{padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
  .col h3{margin:4px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
  #left{background:var(--panel);border-right:1px solid var(--line)}
  #right{background:var(--panel);border-left:1px solid var(--line)}
  #center{position:relative;background:radial-gradient(circle at 50% 40%,#101a2e,#0a0e18 80%)}

  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .stat .n{font-size:24px;font-weight:700}
  .stat .l{color:var(--mut);font-size:12px}

  .rank{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;
    display:flex;align-items:center;gap:10px}
  .rank .pos{width:22px;height:22px;border-radius:50%;background:var(--chip);color:var(--mut);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .rank .pos.top{background:var(--bad);color:#fff}
  .rank .nm{flex:1;font-size:13px;font-weight:600}
  .rank .tp{color:var(--mut);font-size:11px}
  .thr{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
  .thr i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--warn),var(--bad))}

  .flag{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);
    border-radius:8px;padding:8px 10px;font-size:12px}
  .flag b{color:var(--warn)}
  .flag .note{color:var(--mut);font-size:11px;margin-top:2px}

  #cy{width:100%;height:100%}
  #center .legend{position:absolute;bottom:14px;left:14px;background:rgba(18,24,38,.85);
    padding:10px 12px;border-radius:10px;font-size:12px;color:var(--mut);z-index:5}
  #center .legend span{display:flex;align-items:center;gap:6px;margin:2px 0}
  #center .legend .dot{width:10px;height:10px;border-radius:50%}
  .tooltip{position:absolute;z-index:20;background:#0d1220;border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);
    max-width:260px;pointer-events:none}
  .tooltip h4{margin:0 0 4px;font-size:13px}
  .tooltip .k{color:var(--mut)}
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600}
  .b-person{background:#3b4a7a;color:#cfd8ff}
  .b-phone{background:#2f5d4a;color:#b6ffdd}
  .b-account{background:#6b4a7a;color:#f0d0ff}
  .b-vehicle{background:#5a4a30;color:#ffe6b8}
  .b-org{background:#4a5a6a;color:#d0e0f0}
  .b-loc{background:#3a4a5a;color:#c0d8f0}
  .b-date,.b-fir{background:#4a4a4a;color:#ddd}
  #status{font-size:12px;color:var(--mut)}
  .empty{color:var(--mut);text-align:center;padding:20px;font-size:12px}
  .comms .flag{cursor:pointer}
  .comms .flag:hover{border-color:var(--acc)}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>🕵️ Criminal Network Analysis <small>AI-Powered • SIH 2026</small></h1>
    <span class="tag" id="status">loading data…</span>
    <div class="spacer"></div>
    <select id="dataset" title="Choose dataset to view/analyze">
      <option value="synthetic">Synthetic demo</option>
      <option value="real">Real police FIRs</option>
    </select>
    <button id="rerun" disabled>Re-analyze dataset</button>
  </header>

  <div id="left" class="col">
    <h3>Case Overview</h3>
    <div class="stats">
      <div class="stat"><div class="n" id="s_nodes">–</div><div class="l">Entities</div></div>
      <div class="stat"><div class="n" id="s_edges">–</div><div class="l">Relations</div></div>
      <div class="stat"><div class="n" id="s_comm">–</div><div class="l">Communities</div></div>
      <div class="stat"><div class="n" id="s_anom">–</div><div class="l">Anomalies</div></div>
    </div>

    <h3>Key Influencers</h3>
    <div id="rank"></div>

    <h3>Detected Communities</h3>
    <div class="comms" id="comms"></div>
  </div>

  <div id="center">
    <div id="cy"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--bad)"></span>High threat</span>
      <span><span class="dot" style="background:var(--warn)"></span>Medium threat</span>
      <span><span class="dot" style="background:var(--good)"></span>Low threat</span>
    </div>
    <div class="tooltip" id="tip" style="display:none"></div>
  </div>

  <div id="right" class="col">
    <h3>Anomalies &amp; Flags</h3>
    <div id="anom"></div>
    <h3>Evidence Trail</h3>
    <div id="evidence"><div class="empty">Click a node to see its evidence trail.</div></div>
  </div>
</div>

<script>
const cyEl = document.getElementById('cy');
const $ = s => document.querySelector(s);
let cy = null;
let DATA = null;
const TYPE_COLOR = {PERSON:'#4f7cff',PHONE:'#3ecf8e',ACCOUNT:'#b777e0',VEHICLE:'#e0a75c',
                    ORG:'#7aa7d0',LOC:'#62b6b6',DATE:'#888',FIR:'#777',AMOUNT:'#888'};
const TYPE_BADGE = {PERSON:'b-person',PHONE:'b-phone',ACCOUNT:'b-account',VEHICLE:'b-vehicle',
                    ORG:'b-org',LOC:'b-loc',DATE:'b-date',FIR:'b-fir',AMOUNT:'b-date'};

function threats(num){
  num=(num||0);
  return num>0.5?'high':num>0.2?'medium':'low';
}
function nodeColor(node){
  const t=threats(node.threat);
  return t==='high'?'var(--bad)':t==='medium'?'var(--warn)':'var(--good)';
}

function initCy(){
  cy = cytoscape({
    container: cyEl,
    elements: DATA.nodes.map(n=>({data:{
      id:n.id,label:(n.value||n.id).slice(0,18),type:n.type,threat:n.threat,
      comm:n.community,betweenness:n.betweenness,degree:n.degree,strength:n.strength,
      phone:n.phone||'', value:n.value||'', sources:(n.sources||[]).slice(0,4)
    }})).concat(DATA.edges.map(e=>({data:{
      id:e.source+'→'+e.target, source:e.source,target:e.target,
      weight:e.weight,kinds:(e.kinds||[]).join('/')
    }}))),
    style:[
      {selector:'node',style:{'background-color':n=>nodeColor(n.data),
        'label':'data(label)','color':'#dfe6f5','font-size':'11px','text-valign':'bottom',
        'text-margin-y':4,'width':n=> 16+Math.sqrt((n.data.strength||4))*1.6,
        'height':n=> 16+Math.sqrt((n.data.strength||4))*1.6,
        'border-width':n=>n.data.threat>0.5?'3px':'1px',
        'border-color':'#fff'}},
      {selector:'edge',style:{'width':e=> Math.min(2+Math.sqrt(e.data.weight)*1.2,9),
        'line-color':'#3a4666','target-arrow-color':'#3a4666',
        'curve-style':'bezier','opacity':0.7}},
      {selector:'.high',style:{'background-color':'var(--bad)','border-color':'#fff'}},
    ],
    layout:{name:'cose',animate:false,nodeRepulsion:12000,idealEdgeLength:90,
      gravity:0.2,randomize:true},
    minZoom:0.2,maxZoom:3,
  });
  cy.on('tap','node',showNode);
  cy.on('tap',()=>{ $('#tip').style.display='none'; });
}

function showNode(evt){
  const n=evt.target; const d=n.data();
  const tip=$('#tip');
  const phone=d.phone?`<div><span class="k">Phone:</span> ${d.phone}</div>`:'';
  const kinds='<div><span class="k">Connectivity:</span> <span class="badge '+TYPE_BADGE[d.type]||''+'">'+d.type+'</span> · deg '+d.degree+' · betweenness '+d.betweenness+'</div>';
  tip.innerHTML=`<h4>${d.label}</h4>${phone}
    <div><span class="k">Threat:</span> ${(d.threat||0).toFixed(3)} (${threats(d.threat)})</div>
    <div><span class="k">Community:</span> ${d.comm}</div>
    ${kinds}
    <div style="margin-top:6px"><span class="k">Evidence (${(d.sources||[]).length}):</span></div>
    <div style="font-size:11px;color:var(--mut);margin-top:2px">${(d.sources||[]).join(', ')||'—'}</div>`;
  const r=cyEl.getBoundingClientRect();
  tip.style.left=(evt.renderedPosition.x+12)+'px';
  tip.style.top=(evt.renderedPosition.y+12)+'px';
  tip.style.display='block';
}

function render(){
  $('#s_nodes').textContent=DATA.stats.n_nodes;
  $('#s_edges').textContent=DATA.stats.n_edges;
  $('#s_comm').textContent=DATA.stats.n_communities;
  $('#s_anom').textContent=DATA.anomalies.length;
  $('#status').textContent=DATA.stats.n_nodes+' entities · '+DATA.stats.n_edges+' edges · '+DATA.stats.n_communities+' gangs';

  // ranks
  $('#rank').innerHTML=DATA.top_influencers.slice(0,8).map((r,i)=>{
    const roleBadge = r.role==='kingpin'?'<span style="color:var(--bad);font-weight:800">KINGS</span>'
      :r.role==='financier'?'<span style="color:var(--warn)">FIN</span>'
      :r.role==='lieutenant'?'<span style="color:var(--acc)">LT</span>':'';
    return `<div class="rank"><div class="pos ${i<3?'top':''}">${i+1}</div>
     <div style="flex:1"><div class="nm">${roleBadge} ${r.name||r.id}</div>
     <div class="tp">${r.type} · ${r.role||'node'} · threat ${r.threat.toFixed(3)}</div>
     <div class="thr"><i style="width:${Math.round(r.threat*100)}%"></i></div></div></div>`;
  }).join('')||'<div class="empty">No influencers.</div>';

  // anomalies
  $('#anom').innerHTML=DATA.anomalies.map(a=>
    `<div class="flag"><b>${a.flag}</b><div>${resolveName(a.id)}</div><div class="note">${a.note}</div></div>`
  ).join('')||'<div class="empty">No anomalies flagged.</div>';

  // communities
  $('#comms').innerHTML=DATA.communities.slice(0,8).map((c,i)=>
    `<div class="flag" data-comm="${c.community}" title="Click to highlight"><b>Gang #${i+1}</b>
     <div>${c.size} members · threat ${c.threat.toFixed(2)}</div></div>`
  ).join('')||'<div class="empty">none</div>';
  document.querySelectorAll('.comms .flag').forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.comm;
      cy.elements().removeClass('hl');
      cy.$('node[comm="'+id+'"]').addClass('hl');
      cy.$('node[comm="'+id+'"]').style('border-color','#ffb454').style('border-width','4px');
    };
  });

  initCy();
}

function resolveName(id){
  const n=(DATA.nodes||[]).find(n=>n.id===id);
  return n? n.value||id : id;
}

async function load(){
  try{
    const ds=$('#dataset').value;
    let r=await fetch('/results?dataset='+ds);
    if(!r.ok) throw 0;
    DATA=await r.json();
    render();
  }catch(e){
    $('#status').textContent='no results — run analyze';
    $('#rank').innerHTML='<div class="empty">Click "Re-analyze dataset" to run the pipeline.</div>';
  }
}
$('#rerun').onclick=async ()=>{
  $('#rerun').disabled=true; $('#status').textContent='analyzing…';
  const ds=$('#dataset').value;
  let r=await fetch('/analyze?dataset='+ds,{method:'POST'});
  DATA=await r.json(); render();
  $('#rerun').disabled=false;
};
$('#dataset').onchange=()=>{ load(); };
load();
</script>
</body>
</html>
